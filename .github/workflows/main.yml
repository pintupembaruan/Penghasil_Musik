name: Islamic Music Bot Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: "3.10"
          activate-environment: music-bot

      - name: Install All-in-One Conda & Pip
        shell: bash -l {0}
        run: |
          # 1. Instal biner AV dan FFmpeg (Anti-Error Build)
          conda install -y -c conda-forge ffmpeg av pkg-config
          
          # 2. Instal Torch CPU
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          
          # 3. Instal dependensi pendukung secara manual
          pip install pandas omegaconf hydra-core sentencepiece einops local-attention flashy trendy demucs julius encodec docopt pesq
          
          # 4. Ambil kode Audiocraft (Clone)
          git clone https://github.com/facebookresearch/audiocraft.git
          
      - name: Generate Music
        shell: bash -l {0}
        run: |
          # Jalankan skrip tanpa melakukan 'pip install .'
          python generate_music.py

      - name: Commit and Push
        shell: bash -l {0}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          mkdir -p music
          git add music/*.mp3 || echo "No files"
          git commit -m "Add new original Islamic music" || echo "No changes"
          git push
