name: Islamic Music Bot Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev pkg-config

      - name: Install Python Packages (No-Build Mode)
        run: |
          python -m pip install --upgrade pip
          # Set Path agar pkg-config menemukan library FFmpeg
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          
          # Paksa instalasi biner 'av' agar tidak terjadi build wheel
          pip install --only-binary=:all: av
          
          # Instal Torch versi CPU
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          
          # Instal Audiocraft TANPA dependensi yang memicu build ulang
          pip install --no-deps git+https://github.com/facebookresearch/audiocraft.git
          
          # Instal dependensi pendukung Audiocraft secara manual
          pip install pandas typing-extensions omegaconf hydra-core sentencepiece einops local-attention flashy trendy
          
          # Instal project ini
          pip install .

      - name: Generate Music
        run: python generate_music.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          mkdir -p music
          git add music/*.mp3 || echo "No new files"
          git commit -m "Add new 1-minute original Islamic music" || echo "No changes"
          git push
