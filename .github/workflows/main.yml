name: Islamic Music Bot Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: "3.10"
          activate-environment: bot-env

      - name: Install Binaries (Conda)
        shell: bash -l {0}
        run: |
          # Conda menginstal versi 'Pre-Built' sehingga tidak ada error build wheel
          conda install -y -c conda-forge ffmpeg av pkg-config
          
      - name: Install Python Core
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          # Instal Torch versi CPU yang sudah jadi
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          
          # Instal library pendukung yang stabil (TANPA trendy untuk sementara)
          pip install pandas omegaconf hydra-core sentencepiece einops local-attention flashy demucs julius encodec docopt pesq

      - name: Manual Clone Audiocraft
        shell: bash -l {0}
        run: |
          # Ambil kodenya saja
          git clone https://github.com/facebookresearch/audiocraft.git temp_ac
          mv temp_ac/audiocraft .
          rm -rf temp_ac

      - name: Generate Music
        shell: bash -l {0}
        run: |
          # Pastikan tidak ada file sisa yang memicu pip
          rm -f requirements.txt
          python generate_music.py

      - name: Commit and Push
        shell: bash -l {0}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          mkdir -p music
          git add music/*.mp3 || echo "No files"
          git commit -m "Add new original Islamic music" || echo "No changes"
          git push
