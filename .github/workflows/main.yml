name: Islamic Music Bot Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: "3.10"
          activate-environment: music-bot

      - name: Install All Binaries via Conda
        shell: bash -l {0}
        run: |
          # Instal ffmpeg dan av biner langsung (Anti-Error Build)
          conda install -y -c conda-forge ffmpeg av pkg-config python-build
          
      - name: Install AI Libraries
        shell: bash -l {0}
        run: |
          # Instal Torch versi CPU
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          
          # Instal audiocraft TANPA membiarkan dia membangun 'av' sendiri
          # Kita gunakan --no-build-isolation agar dia pakai 'av' yang sudah ada di Conda
          pip install --no-build-isolation git+https://github.com/facebookresearch/audiocraft.git
          
          # Instal sisa dependensi pendukung
          pip install pandas omegaconf hydra-core sentencepiece einops local-attention flashy trendy demucs julius encodec docopt pesq

      - name: Generate Music
        shell: bash -l {0}
        run: python generate_music.py

      - name: Commit and Push
        shell: bash -l {0}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          mkdir -p music
          git add music/*.mp3 || echo "No files"
          git commit -m "Add new original Islamic music" || echo "No changes"
          git push
