name: Islamic Music Bot Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: "3.10"
          activate-environment: music-bot

      - name: Install Multimedia Binaries
        shell: bash -l {0}
        run: |
          # Kita instal biner av yang sudah jadi agar tidak perlu build wheel lagi
          conda install -y -c conda-forge ffmpeg av pkg-config

      - name: Install AI Libraries (Step by Step)
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          # 1. Instal Torch CPU
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          
          # 2. Instal semua teman-temannya audiocraft secara manual
          pip install pandas omegaconf hydra-core sentencepiece einops local-attention flashy trendy demucs julius encodec docopt pesq
          
          # 3. KUNCI UTAMA: Instal audiocraft TANPA dependensi (agar dia tidak mencoba instal 'av' lagi)
          pip install --no-deps git+https://github.com/facebookresearch/audiocraft.git
          
          # 4. Instal project lokal
          pip install .

      - name: Generate Music
        shell: bash -l {0}
        run: python generate_music.py

      - name: Commit and Push
        shell: bash -l {0}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          mkdir -p music
          git add music/*.mp3 || echo "No files"
          git commit -m "Add new original Islamic music" || echo "No changes"
          git push
