name: Islamic Music Bot Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip' # Mempercepat build berikutnya

      - name: Install Critical System Libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg pkg-config \
            libavformat-dev libavcodec-dev libavdevice-dev \
            libavutil-dev libswscale-dev libswresample-dev libavfilter-dev

      - name: Install Python Dependencies (Pre-compiled)
        run: |
          python -m pip install --upgrade pip
          # Menggunakan versi CPU saja agar lebih ringan dan stabil
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          # Install library pendukung sebelum audiocraft
          pip install numpy omegaconf hyra-core sentencepiece
          # Install audiocraft langsung dari sumbernya
          pip install git+https://github.com/facebookresearch/audiocraft.git
          # Install sisa dependensi dari setup.py
          pip install .

      - name: Generate Music
        run: python generate_music.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # Pastikan folder music ada agar tidak error saat git add
          mkdir -p music
          git add music/*.mp3 || echo "No files to add"
          git commit -m "Add new original Islamic music" || echo "Nothing to commit"
          git push
