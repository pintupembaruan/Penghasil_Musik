name: Islamic Music Bot Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config \
            libavformat-dev libavcodec-dev libavdevice-dev \
            libavutil-dev libswscale-dev libswresample-dev libavfilter-dev

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          # KUNCI UTAMA: Instal 'av' dalam bentuk biner agar tidak build wheel
          pip install --only-binary=:all: av
          # Instal Torch versi CPU agar tidak berat
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          # Instal dependensi lain secara manual untuk keamanan
          pip install numpy omegaconf hydra-core sentencepiece
          # Instal Audiocraft langsung
          pip install git+https://github.com/facebookresearch/audiocraft.git
          pip install .

      - name: Generate Music
        run: python generate_music.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          mkdir -p music
          git add music/*.mp3 || echo "No new files"
          git commit -m "Add new 1-minute original Islamic music" || echo "Nothing to commit"
          git push
