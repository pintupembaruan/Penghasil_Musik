name: Islamic Music Bot Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: "3.10"
          activate-environment: music-bot

      - name: Install Binaries (Conda)
        shell: bash -l {0}
        run: |
          # Instal ffmpeg dan av biner lewat conda (ini kunci keberhasilan)
          conda install -y -c conda-forge ffmpeg av pkg-config

      - name: Install AI Dependencies (Tanpa Audiocraft)
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          # Instal semua teman-temannya audiocraft agar sistem siap
          pip install pandas omegaconf hydra-core sentencepiece einops local-attention flashy trendy demucs julius encodec docopt pesq

      - name: Manual Bypass Audiocraft
        shell: bash -l {0}
        run: |
          # Kita download kodenya saja, jangan di-install via pip!
          git clone https://github.com/facebookresearch/audiocraft.git temp_folder
          mv temp_folder/audiocraft .
          rm -rf temp_folder

      - name: Generate Music
        shell: bash -l {0}
        run: python generate_music.py

      - name: Commit and Push
        shell: bash -l {0}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          mkdir -p music
          git add music/*.mp3 || echo "No files"
          git commit -m "Add new original Islamic music" || echo "No changes"
          git push
