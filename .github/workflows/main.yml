name: Islamic Music Bot Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: "3.10"
          activate-environment: music-bot

      - name: Install Binaries (Anti-Build)
        shell: bash -l {0}
        run: |
          # Instal ffmpeg dan av biner yang sudah jadi lewat conda
          conda install -y -c conda-forge ffmpeg av
          
      - name: Install AI Dependencies
        shell: bash -l {0}
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          # Instal dependensi audiocraft KECUALI audiocraft itu sendiri
          pip install pandas omegaconf hydra-core sentencepiece einops local-attention flashy trendy demucs julius encodec docopt pesq

      - name: Clone Audiocraft Manual
        shell: bash -l {0}
        run: |
          # Kita ambil kodenya saja tanpa menginstalnya ke pip (untuk menghindari error 'av')
          git clone https://github.com/facebookresearch/audiocraft.git temp_audiocraft
          mv temp_audiocraft/audiocraft .
          rm -rf temp_audiocraft

      - name: Generate Music
        shell: bash -l {0}
        run: python generate_music.py

      - name: Commit and Push
        shell: bash -l {0}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          mkdir -p music
          git add music/*.mp3 || echo "No files"
          git commit -m "Add new original Islamic music" || echo "No changes"
          git push
